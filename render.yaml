services:
  - type: web
    name: cat-colony-watch
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_API_KEY
        sync: false
      - key: TEAM_PASSCODE
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
